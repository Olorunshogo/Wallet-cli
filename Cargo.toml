[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

# Every crate pulls versions from here so `bitcoin` resolves to a single 0.32.x
# across bdk_wallet, bitcoincore-rpc and our own crates.
[workspace.dependencies]
wallet-core = { path = "crates/wallet-core" }
wallet-bdk = { path = "crates/wallet-bdk" }
wallet-rpc = { path = "crates/wallet-rpc" }
wallet = { path = "crates/wallet" }

bitcoin = { version = "0.32", default-features = false, features = ["std"] }
bdk_wallet = { version = "3.2", features = ["rusqlite", "keys-bip39"] }
bitcoincore-rpc = "0.19"
thiserror = "2"
zeroize = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1"
corepc-node = { version = "0.12", features = ["download", "29_0"] }
tempfile = "3"
tracing = "0.1"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
proptest = "1"
ratatui = "0.30"
qrcode = { version = "0.14", default-features = false }
toml = "1"
dotenvy = "0.15"
assert_cmd = "2"
predicates = "3"
colored = "3"
indicatif = "0.18"
